<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Delta — Planning</title>
  <script src="/sd-pwa.js?v=pwa"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --line:#d0d5dd; --head:#f2f4f7; --ink:#1d2939; --muted:#667085;
      --hour:72px; --gutter:52px;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; color:var(--ink); background:#f8f9fc; }
    header { display:flex; gap:12px; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header h1 { font-family: Outfit, Inter, sans-serif; font-size:18px; margin:0; }
    .msg { font-size:12px; color:var(--muted); }
    .msg.error { color:#b42318; }
    .tools { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    button { border:1px solid #1d2939; background:#1d2939; color:#fff; border-radius:6px; padding:8px 12px; font-weight:600; cursor:pointer; }
    button.ghost { background:#fff; color:#1d2939; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .layout { display:grid; grid-template-columns: minmax(280px, 360px) 1fr; min-height:calc(100vh - 58px); }
    .queue { border-right:1px solid var(--line); background:#fff; padding:14px; overflow:auto; }
    .queue h2, .cals h2 { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
    .help { font-size:13px; color:var(--muted); margin:0 0 12px; line-height:1.45; }
    input[type=search] { width:100%; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; margin:0 0 12px; }
    .order { border:1px solid var(--line); border-radius:10px; padding:10px 10px 8px; margin:0 0 8px; background:#fff; }
    .order.scheduled { background:#f8fafc; }
    .order-top { display:flex; gap:8px; align-items:flex-start; }
    .order-top label { display:flex; gap:8px; align-items:flex-start; flex:1; cursor:pointer; }
    .order h3 { margin:0; font-size:14px; font-family: Outfit, Inter, sans-serif; }
    .order p { margin:2px 0 0; font-size:12px; color:var(--muted); }
    .pill { display:inline-block; font-size:10px; font-weight:700; border:1px solid var(--line); border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:middle; }
    .pill.on { background:#ecfdf3; border-color:#abefc6; color:#067647; }
    .tasks { display:none; margin:10px 0 0; padding-top:8px; border-top:1px dashed var(--line); }
    .order.open .tasks { display:block; }
    .task-row { display:grid; grid-template-columns: 1fr 140px; gap:6px; align-items:center; margin:0 0 6px; font-size:12px; }
    .task-row span { color:#344054; }
    .task-row em { font-style:normal; color:var(--muted); font-weight:600; }
    .task-row select { width:100%; border:1px solid var(--line); border-radius:6px; padding:5px 6px; font:inherit; }
    .actions { display:flex; gap:6px; margin-top:10px; }
    .actions button { flex:1; font-size:12px; padding:7px 8px; }
    .empty, .loading { background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px 16px; color:var(--muted); }
    .cals { padding:14px 16px 40px; overflow:auto; }
    .weekbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 12px; }
    .weekbar strong { font-family: Outfit, Inter, sans-serif; font-size:16px; }
    .legend { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px; }
    .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; border:1px solid transparent; }
    .legend span { font-size:11px; font-weight:600; color:#344054; display:inline-flex; align-items:center; margin-right:8px; }
    .worker { margin:0 0 28px; }
    .worker h3 { margin:0 0 8px; font-size:15px; font-family: Outfit, Inter, sans-serif; }
    .worker h3 small { font-weight:500; color:var(--muted); font-family: Inter, sans-serif; font-size:12px; margin-left:8px; }
    .cal { min-width:640px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
    .cal-head, .cal-body { display:grid; grid-template-columns: var(--gutter) repeat(5, 1fr); }
    .cal-head { background:var(--head); border-bottom:1px solid var(--line); }
    .cal-head div, .time-col { font-size:11px; font-weight:700; color:#344054; padding:8px 6px; }
    .day { position:relative; height:calc(var(--hour) * 8); border-left:1px solid #e4e7ec; background:
      linear-gradient(#f2f4f7, #f2f4f7) 0 calc(var(--hour) * 4.25) / 100% calc(var(--hour) * 0.5) no-repeat,
      repeating-linear-gradient(to bottom, transparent, transparent calc(var(--hour) - 1px), #eef2f6 calc(var(--hour) - 1px), #eef2f6 var(--hour));
    }
    .time-col { position:relative; height:calc(var(--hour) * 8); color:var(--muted); font-weight:600; }
    .time-col span { position:absolute; left:4px; transform:translateY(-50%); white-space:nowrap; }
    .block {
      position:absolute; left:3px; right:3px; border-radius:6px; padding:3px 5px;
      font-size:11px; line-height:1.25; overflow:hidden; border:1px solid transparent;
      box-shadow:0 1px 2px rgba(16,24,40,.08); cursor:pointer;
    }
    .block b { display:block; font-size:11px; }
    .block small { display:block; color:inherit; opacity:.85; }
    .lunch-note { position:absolute; left:0; right:0; top:calc(var(--hour) * 4.25); height:calc(var(--hour) * 0.5);
      display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#98a2b3; pointer-events:none; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .queue { border-right:0; border-bottom:1px solid var(--line); max-height:46vh; }
      .tools { width:100%; margin-left:0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Planning</h1>
    <span class="msg" id="status">Weekly work calendars — Monday to Friday only.</span>
    <div class="tools">
      <button class="ghost" type="button" id="prevWeek">← Week</button>
      <strong id="weekLabel"></strong>
      <button class="ghost" type="button" id="nextWeek">Week →</button>
      <button class="ghost" type="button" id="thisWeek">This week</button>
    </div>
  </header>
  <div class="layout">
    <aside class="queue">
      <h2>Orders to schedule</h2>
      <p class="help">Not Yet Started and Ready for Steelwork. Hours come from Task times for that product. Skip a process when hours are 0. Assign the people ticked for each task, then place the next free paid slot on their calendar.</p>
      <input type="search" id="q" placeholder="Search order, product, status">
      <div class="actions" style="margin:0 0 12px">
        <button type="button" id="scheduleSelected">Schedule selected</button>
      </div>
      <div id="queue"></div>
    </aside>
    <main class="cals">
      <div class="legend" id="legend"></div>
      <div id="calendars"></div>
    </main>
  </div>
  <script src="/office-auth.js?v=plain-copy"></script>
  <script>
    const DAY_START = 7 * 60 + 45;
    const DAY_SPAN = 8 * 60;
    const TICKS = [
      { label: "07:45", min: 7 * 60 + 45 },
      { label: "09:00", min: 9 * 60 },
      { label: "10:00", min: 10 * 60 },
      { label: "11:00", min: 11 * 60 },
      { label: "12:00", min: 12 * 60 },
      { label: "12:30", min: 12 * 60 + 30 },
      { label: "14:00", min: 14 * 60 },
      { label: "15:45", min: 15 * 60 + 45 }
    ];
    let board = null;
    let week = "";
    const openOrders = {};
    const picked = {};
    const assigns = {};

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function color(process) {
      return (board && board.colors && board.colors[process]) || { bg: "#eef2f6", fg: "#344054", border: "#98a2b3" };
    }
    function minutesOf(iso) {
      const m = String(iso || "").match(/T(\d{2}):(\d{2})/);
      return m ? Number(m[1]) * 60 + Number(m[2]) : 0;
    }
    function dateOf(iso) {
      return String(iso || "").slice(0, 10);
    }
    function addDays(iso, n) {
      const p = iso.split("-").map(Number);
      const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
      return d.toISOString().slice(0, 10);
    }
    function hhmm(iso) {
      const m = String(iso || "").match(/T(\d{2}):(\d{2})/);
      return m ? m[1] + ":" + m[2] : "";
    }
    function topPx(min) {
      return ((min - DAY_START) / DAY_SPAN) * 100;
    }
    function heightPx(startMin, endMin) {
      return Math.max(3.2, ((endMin - startMin) / DAY_SPAN) * 100);
    }
    function setStatus(text, isError) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = "msg" + (isError ? " error" : "");
    }
    function clipToDay(block, dayIso) {
      const start = dateOf(block.start);
      const end = dateOf(block.end);
      if (end < dayIso || start > dayIso) return null;
      if (block.kind === "paint") {
        if (start <= dayIso && end > dayIso) {
          return { startMin: DAY_START, endMin: 15 * 60 + 45 };
        }
        return null;
      }
      let startMin = start === dayIso ? minutesOf(block.start) : DAY_START;
      let endMin = end === dayIso ? minutesOf(block.end) : 15 * 60 + 45;
      if (end === dayIso && minutesOf(block.end) === 0) return null;
      startMin = Math.max(DAY_START, startMin);
      endMin = Math.min(15 * 60 + 45, endMin);
      if (endMin <= startMin) return null;
      return { startMin, endMin };
    }
    function renderLegend() {
      const processes = (board && board.processes ? board.processes.slice() : []).concat(["Powder coating"]);
      document.getElementById("legend").innerHTML = processes.map((p) => {
        const c = color(p);
        return "<span><i style='background:" + c.bg + ";border-color:" + c.border + "'></i>" + esc(p) + "</span>";
      }).join("");
    }
    function renderQueue() {
      const q = String(document.getElementById("q").value || "").trim().toLowerCase();
      const rows = ((board && board.queue) || []).filter((o) => {
        if (!q) return true;
        return [o.order_number, o.product, o.status, o.type].join(" ").toLowerCase().indexOf(q) !== -1;
      });
      const box = document.getElementById("queue");
      if (!rows.length) {
        box.innerHTML = "<div class='empty'>" + (q ? "No orders match that search." : "No Not Yet Started or Ready for Steelwork orders.") + "</div>";
        return;
      }
      box.innerHTML = rows.map((o) => {
        const id = o.order_number;
        if (!assigns[id]) assigns[id] = {};
        const checked = picked[id] ? " checked" : "";
        const open = openOrders[id] || picked[id] ? " open" : "";
        const tasks = (o.processes || []).map((p) => {
          const chosen = assigns[id][p.process] || (p.workers.length === 1 ? p.workers[0].id : "");
          if (p.workers.length === 1) assigns[id][p.process] = p.workers[0].id;
          const opts = ["<option value=''>Assign person</option>"].concat(
            p.workers.map((w) => "<option value=\"" + esc(w.id) + "\"" + (w.id === chosen ? " selected" : "") + ">" + esc(w.name) + "</option>")
          );
          const empty = p.workers.length ? "" : "<option value=''>Nobody ticked for this task</option>";
          return "<div class='task-row'><span>" + esc(p.process) + " <em>" + p.hours + " h</em></span><select data-order=\"" + esc(id) + "\" data-process=\"" + esc(p.process) + "\">" + (p.workers.length ? opts.join("") : empty) + "</select></div>";
        }).join("");
        const none = tasks ? "" : "<p>No Task times for this product. Add hours on Task times first.</p>";
        return "<article class='order" + (o.scheduled ? " scheduled" : "") + open + "' data-id=\"" + esc(id) + "\">" +
          "<div class='order-top'><label><input type='checkbox' data-pick=\"" + esc(id) + "\"" + checked + ">" +
          "<div><h3>" + esc(id) + (o.scheduled ? "<span class='pill on'>On calendar</span>" : "") + "</h3>" +
          "<p>" + esc(o.product || "No product") + " · " + esc(o.status) + (o.type ? " · " + esc(o.type) : "") + "</p></div></label></div>" +
          "<div class='tasks'>" + (tasks || none) +
          "<div class='actions'><button type='button' data-schedule=\"" + esc(id) + "\">Schedule</button>" +
          (o.scheduled ? "<button class='ghost' type='button' data-unschedule=\"" + esc(id) + "\">Unschedule</button>" : "") +
          "</div></div></article>";
      }).join("");
    }
    function renderCalendars() {
      const box = document.getElementById("calendars");
      if (!board) {
        box.innerHTML = "<div class='loading'>Loading calendars…</div>";
        return;
      }
      const days = board.weekDays || [];
      document.getElementById("weekLabel").textContent = days.length
        ? days[0].label + " – " + days[4].label
        : "";
      const workers = (board.workers || []).concat([board.paintShop]);
      if (!workers.length) {
        box.innerHTML = "<div class='empty'>Add people on Users and tick the shop tasks they do. Each of those people gets a week calendar here.</div>";
        return;
      }
      const head = "<div class='cal-head'><div></div>" + days.map((d) => "<div>" + esc(d.label) + "</div>").join("") + "</div>";
      const ticks = TICKS.map((t) => "<span style='top:" + topPx(t.min) + "%'>" + t.label + "</span>").join("");
      box.innerHTML = workers.map((w) => {
        const mine = (board.blocks || []).filter((b) => String(b.workerId) === String(w.id));
        const daysHtml = days.map((d) => {
          const bits = mine.map((b) => {
            const clip = clipToDay(b, d.iso);
            if (!clip) return "";
            const c = color(b.process);
            return "<div class='block' style='top:" + topPx(clip.startMin) + "%;height:" + heightPx(clip.startMin, clip.endMin) + "%;background:" + c.bg + ";color:" + c.fg + ";border-color:" + c.border + "' title=\"" + esc(b.studioNo + " · " + b.process) + "\">" +
              "<b>" + esc(b.studioNo) + "</b><small>" + esc(b.process) + " · " + esc(hhmm(b.start)) + "–" + esc(hhmm(b.end)) + "</small></div>";
          }).join("");
          return "<div class='day'>" + bits + "<div class='lunch-note'>Lunch</div></div>";
        }).join("");
        const tasks = (w.tasks && w.tasks.length) ? "<small>" + esc(w.tasks.join(" · ")) + "</small>" : "";
        return "<section class='worker'><h3>" + esc(w.name) + tasks + "</h3><div class='cal'>" + head +
          "<div class='cal-body'><div class='time-col'>" + ticks + "</div>" + daysHtml + "</div></div></section>";
      }).join("");
      if (!(board.blocks || []).length) {
        box.insertAdjacentHTML("afterbegin", "<div class='empty' style='margin-bottom:14px'>Nobody is booked this week. Tick orders on the left, assign a person for each task, and schedule them. Later orders queue into the next free hours — the same person never overlaps.</div>");
      }
    }
    async function load(nextWeek) {
      setStatus("Loading calendars…");
      try {
        const url = "/api/office/planning" + (nextWeek ? "?week=" + encodeURIComponent(nextWeek) : "");
        const r = await sdOfficeFetch(url);
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || "Could not load planning.");
        board = j.board;
        week = board.weekStart;
        renderLegend();
        renderQueue();
        renderCalendars();
        const n = (board.workers || []).length;
        setStatus("Work days only · 07:45–12:00 and 12:30–15:45 · " + n + " worker calendar" + (n === 1 ? "" : "s"));
      } catch (e) {
        board = null;
        document.getElementById("queue").innerHTML = "<div class='empty'>Could not load the order list.</div>";
        document.getElementById("calendars").innerHTML = "<div class='empty'>Could not load calendars.</div>";
        setStatus(e.message || String(e), true);
      }
    }
    function collectAssignments(id) {
      const out = {};
      document.querySelectorAll("select[data-order=\"" + id + "\"]").forEach((sel) => {
        out[sel.getAttribute("data-process")] = sel.value;
      });
      assigns[id] = out;
      return out;
    }
    async function scheduleIds(ids) {
      if (!ids.length) {
        setStatus("Tick at least one order.", true);
        return;
      }
      const assignments = {};
      for (let i = 0; i < ids.length; i++) assignments[ids[i]] = collectAssignments(ids[i]);
      setStatus("Placing work on the calendars…");
      const r = await sdOfficeFetch("/api/office/planning/schedule", {
        method: "POST",
        body: JSON.stringify({ orderIds: ids, assignments })
      });
      const j = await r.json();
      if (!j.ok) {
        setStatus(j.error || "Could not schedule.", true);
        return;
      }
      ids.forEach((id) => { picked[id] = false; });
      await load(week);
      setStatus("Scheduled " + ids.length + " order" + (ids.length === 1 ? "" : "s") + " into the next free work slots.");
    }
    async function unschedule(id) {
      const r = await sdOfficeFetch("/api/office/planning/orders/" + encodeURIComponent(id), { method: "DELETE" });
      const j = await r.json();
      if (!j.ok) {
        setStatus(j.error || "Could not unschedule.", true);
        return;
      }
      await load(week);
      setStatus("Removed " + id + " from the calendars.");
    }
    document.getElementById("scheduleSelected").onclick = () => {
      const ids = Object.keys(picked).filter((id) => picked[id]);
      scheduleIds(ids);
    };
    document.getElementById("q").addEventListener("input", renderQueue);
    document.getElementById("prevWeek").onclick = () => load(board && board.prevWeek);
    document.getElementById("nextWeek").onclick = () => load(board && board.nextWeek);
    document.getElementById("thisWeek").onclick = () => load("");
    document.getElementById("queue").addEventListener("change", (e) => {
      const pick = e.target.getAttribute("data-pick");
      if (pick) {
        picked[pick] = !!e.target.checked;
        openOrders[pick] = true;
        if (e.target.checked) collectAssignments(pick);
        renderQueue();
        return;
      }
      const order = e.target.getAttribute("data-order");
      if (order) collectAssignments(order);
    });
    document.getElementById("queue").addEventListener("click", (e) => {
      const sched = e.target.getAttribute("data-schedule");
      if (sched) {
        scheduleIds([sched]);
        return;
      }
      const unsched = e.target.getAttribute("data-unschedule");
      if (unsched) {
        unschedule(unsched);
        return;
      }
      const art = e.target.closest(".order");
      if (art && !e.target.closest("input, select, button, label")) {
        const id = art.getAttribute("data-id");
        openOrders[id] = !art.classList.contains("open");
        art.classList.toggle("open");
      }
    });
    sdRequireOffice("planning").then((p) => { if (p) load(); });
  </script>
</body>
</html>
