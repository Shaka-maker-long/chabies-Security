<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Delta — My tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --line:#d0d5dd; --head:#f2f4f7; --ink:#1d2939; --muted:#667085; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; color:var(--ink); background:#f8f9fc; }
    header { display:flex; gap:12px; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header h1 { font-family: Outfit, Inter, sans-serif; font-size:18px; margin:0; }
    .tools { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    input[type=search] { border:1px solid var(--line); border-radius:6px; padding:8px 10px; min-width:180px; }
    button { border:1px solid #1d2939; background:#1d2939; color:#fff; border-radius:6px; padding:8px 12px; font-weight:600; cursor:pointer; }
    button.ghost { background:#fff; color:#1d2939; }
    .wrap { padding:16px; max-width:980px; }
    .msg { font-size:12px; color:var(--muted); }
    .empty { background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px 18px; color:var(--muted); }
    .group { margin:0 0 22px; }
    .group h2 { font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin:0 0 10px; display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
    .card.overdue { border-color:#fda29b; }
    .card h3 { margin:0 0 4px; font-size:15px; }
    .card p { margin:0; font-size:13px; color:var(--muted); }
    .card .grow { flex:1; min-width:200px; }
    .pill { display:inline-block; font-size:11px; font-weight:600; border:1px solid var(--line); border-radius:999px; padding:2px 8px; margin-right:6px; }
    .pill.overdue { color:#b42318; border-color:#fda29b; }
    @media (max-width: 720px) {
      input[type=search] { min-width:0; width:100%; }
      .tools { width:100%; margin-left:0; }
      .card { padding:12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>My tasks</h1>
    <span class="msg" id="who"></span>
    <div class="tools">
      <span class="msg" id="status"></span>
      <input type="search" id="q" placeholder="Search my tasks">
      <button class="ghost" type="button" onclick="load()">Refresh</button>
    </div>
  </header>
  <div class="wrap" id="list"></div>
  <script src="/office-auth.js?v=login-users"></script>
  <script src="/enquiry-process.js?v=change-coster"></script>
  <script>
    let rows = [];
    let me = "";
    function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
    function kindLabel(row) {
      if (row.label) return row.title + " (" + row.label + ")";
      return row.title || row.kind;
    }
    function render() {
      const q = document.getElementById("q").value.toLowerCase();
      const filtered = rows.filter((r) => {
        const blob = [r.enquiry_no, r.client_name, r.product, r.title, r.enquiry_status, r.assignee].join(" ").toLowerCase();
        return !q || blob.indexOf(q) >= 0;
      });
      const overdue = filtered.filter((r) => r.overdue);
      const rest = filtered.filter((r) => !r.overdue);
      const list = document.getElementById("list");
      if (!filtered.length) {
        list.innerHTML = "<div class=\"empty\">" +
          (q ? "No assigned tasks match that search." :
            "Nothing is assigned to you right now. Capture new enquiries on the Enquiries sheet, then assign costing, quoting, follow-up, or drawing to an office Admin. That person will see the work here and update the system from the task.") +
          "</div>";
        return;
      }
      function cards(items) {
        return items.map((row) => {
          return "<article class=\"card" + (row.overdue ? " overdue" : "") + "\">" +
            "<div class=\"grow\">" +
            "<h3>" + esc(row.enquiry_no) + " · " + esc(row.client_name || "No client name yet") + "</h3>" +
            "<p>" + esc(kindLabel(row)) + (row.product ? " · " + esc(row.product) : "") + "</p>" +
            "<p><span class=\"pill" + (row.overdue ? " overdue" : "") + "\">" + esc(row.enquiry_status || "") + "</span>" +
            (row.overdue ? "<span class=\"pill overdue\">Overdue</span>" : "") +
            (row.due_at ? "<span class=\"pill\">Due " + esc(String(row.due_at).slice(0, 10)) + "</span>" : "") +
            "</p></div>" +
            "<button type=\"button\" data-open=\"" + esc(row.enquiry_no) + "\" data-task=\"" + esc(row.id || "") + "\">Update</button>" +
            "</article>";
        }).join("");
      }
      let html = "";
      if (overdue.length) html += "<section class=\"group\"><h2>Overdue</h2>" + cards(overdue) + "</section>";
      if (rest.length) html += "<section class=\"group\"><h2>Assigned to me</h2>" + cards(rest) + "</section>";
      list.innerHTML = html;
      list.onclick = (e) => {
        const btn = e.target.closest("[data-open]");
        if (!btn) return;
        sdOpenEnquiryProcess(btn.getAttribute("data-open"), btn.getAttribute("data-task"));
      };
    }
    window.sdOnEnquiryProcessClose = function () { load(); };
    async function load() {
      document.getElementById("status").textContent = "Loading…";
      const r = await sdOfficeFetch("/api/office/my-tasks");
      const j = await r.json();
      if (!j.ok) { document.getElementById("status").textContent = j.error || "Could not load"; return; }
      rows = j.rows || [];
      document.getElementById("status").textContent = rows.length ? (rows.length + " assigned") : "No open tasks";
      render();
    }
    document.getElementById("q").oninput = render;
    sdRequireOffice("tasks").then((p) => {
      if (!p) return;
      me = p.name || "";
      document.getElementById("who").textContent = me ? ("Signed in as " + me) : "";
      const want = new URLSearchParams(location.search).get("enquiry");
      load().then(() => {
        if (want) sdOpenEnquiryProcess(want);
      });
    });
  </script>
</body>
</html>
