<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Delta — Production schedule</title>
  <script src="/sd-pwa.js?v=pwa"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --line:#d0d5dd; --head:#f2f4f7; --ink:#1d2939; --muted:#667085; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; color:var(--ink); background:#f8f9fc; }
    header { display:flex; gap:16px; align-items:flex-end; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header h1 { font-family: Outfit, Inter, sans-serif; font-size:18px; margin:0; }
    .lede { margin:4px 0 0; color:var(--muted); font-size:12px; max-width:640px; }
    .tabs { display:flex; gap:4px; flex-wrap:wrap; }
    .tabs a { font-size:13px; font-weight:600; color:#344054; text-decoration:none; padding:6px 10px; border-radius:6px; border:1px solid transparent; }
    .tabs a.on { background:#1d2939; color:#fff; }
    .tools { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    button { border:1px solid #1d2939; background:#1d2939; color:#fff; border-radius:6px; padding:8px 12px; font-weight:600; cursor:pointer; font:inherit; font-size:13px; }
    button.ghost { background:#fff; color:#1d2939; }
    .wrap { overflow:auto; height:calc(100vh - 118px); }
    table { border-collapse:collapse; min-width:1600px; background:#fff; font-size:12px; }
    th, td { border:1px solid var(--line); padding:4px 6px; height:34px; white-space:nowrap; }
    th { background:var(--head); position:sticky; top:0; z-index:2; font-size:11px; }
    .day { min-width:58px; text-align:center; }
    .left { min-width:110px; max-width:160px; }
    .cell-text { display:block; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
    td input { width:100%; border:0; font:inherit; background:transparent; }
    .code-cell { text-align:center; font-weight:700; cursor:pointer; user-select:none; }
    .code-cell:focus { outline:2px solid #2f6fed; outline-offset:-2px; }
    #picker {
      position:fixed; z-index:30; display:none; width:240px; background:#fff;
      border:1px solid var(--line); border-radius:10px; padding:8px;
      box-shadow:0 10px 28px rgba(16,24,40,.18);
    }
    #picker.open { display:block; }
    #picker h2 { margin:0 0 6px; font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    #picker .chips { display:flex; flex-wrap:wrap; gap:4px; }
    #picker button { border:0; border-radius:6px; padding:6px 8px; font:inherit; font-size:11px; font-weight:700; cursor:pointer; }
    #picker .clear { width:100%; margin-top:6px; background:#fff; color:#1d2939; border:1px solid var(--line); }
    .msg { font-size:12px; color:var(--muted); }
    .legend { display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); }
    .legend span { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#344054; font-weight:600; }
    .swatch { min-width:28px; padding:2px 6px; border-radius:4px; text-align:center; font-size:11px; font-weight:700; }
    .empty { padding:36px 16px; color:var(--muted); font-size:13px; text-align:center; }
    @media (max-width: 720px) { .tools { width:100%; margin-left:0; } }
  </style>
</head>
<body>
  <header>
    <div>
      <nav class="tabs" aria-label="Orders views">
        <a href="/orders">Sheet</a>
        <a class="on" href="/orders/schedule">Production schedule</a>
        <a href="/orders/delivery">Delivery summary</a>
      </nav>
      <h1>Production schedule</h1>
      <p class="lede">Every order from the sheet is listed here. Mark Latest Delivery (LD) or Latest Courier (LC) on a weekday so it appears on Delivery summary.</p>
    </div>
    <div class="tools">
      <span class="msg" id="status"></span>
      <button class="ghost" type="button" onclick="shift(-7)">← Week</button>
      <button class="ghost" type="button" onclick="shift(7)">Week →</button>
    </div>
  </header>
  <div class="legend" id="legend"></div>
  <div class="wrap"><table id="grid"></table></div>
  <div id="picker" role="listbox" aria-label="Schedule code"></div>
  <script src="/office-auth.js?v=plain-copy"></script>
  <script>
    const LEFT = [
      ["order_number","ORDER", true],
      ["item_type","ITEM TYPE", true],
      ["category","CATEGORY", true],
      ["product","PRODUCT", true],
      ["province","PROVINCE", true],
      ["order_date","ORDER", true],
      ["courier","COURIER", false],
      ["waybill","WAYBILL", false],
      ["status","STATUS", true]
    ];
    let start = new URLSearchParams(location.search).get("start") || "";
    let days = [];
    let rows = [];
    let codes = [];
    let pickCell = null;

    function dow(iso) {
      return ["S","M","T","W","T","F","S"][new Date(iso + "T12:00:00").getDay()];
    }
    function weekLabel(iso) {
      const d = new Date(iso + "T12:00:00");
      const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = utc.getUTCDay() || 7;
      utc.setUTCDate(utc.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
      const w = Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);
      return "Week" + String(w).padStart(2, "0");
    }
    function pretty(iso) {
      const d = new Date(iso + "T12:00:00");
      return d.getDate() + " " + d.toLocaleString("en-GB", { month: "short" });
    }
    function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
    function codeStyle(code) {
      const hit = codes.find((c) => c.code === code);
      if (!hit) return "";
      return "background:" + hit.bg + ";color:" + hit.fg;
    }

    function renderLegend() {
      document.getElementById("legend").innerHTML = codes.map((c) => {
        return "<span><b class=\"swatch\" style=\"" + codeStyle(c.code) + "\">" + esc(c.code) + "</b>" + esc(c.label) + "</span>";
      }).join("");
    }

    function paintCell(td, value) {
      td.dataset.code = value || "";
      td.textContent = value || "";
      td.setAttribute("style", codeStyle(value));
    }

    function renderPicker() {
      const box = document.getElementById("picker");
      const groups = {};
      codes.forEach((c) => {
        if (!groups[c.group]) groups[c.group] = [];
        groups[c.group].push(c);
      });
      box.innerHTML = Object.keys(groups).map((g) => {
        return "<h2>" + esc(g) + "</h2><div class=\"chips\">" + groups[g].map((c) => {
          return "<button type=\"button\" data-code=\"" + esc(c.code) + "\" style=\"" + codeStyle(c.code) + "\" title=\"" + esc(c.label) + "\">" + esc(c.code) + "</button>";
        }).join("") + "</div>";
      }).join("") + "<button type=\"button\" class=\"clear\" data-code=\"\">Clear</button>";
    }

    function closePicker() {
      pickCell = null;
      document.getElementById("picker").classList.remove("open");
    }

    function openPicker(td) {
      pickCell = td;
      const box = document.getElementById("picker");
      box.classList.add("open");
      const r = td.getBoundingClientRect();
      const left = Math.min(Math.max(8, r.left), window.innerWidth - 256);
      const top = r.bottom + 6 + 200 > window.innerHeight ? Math.max(8, r.top - 206) : r.bottom + 6;
      box.style.left = left + "px";
      box.style.top = top + "px";
    }

    function render() {
      const table = document.getElementById("grid");
      if (!rows.length) {
        table.innerHTML = "";
        const wrap = table.parentElement;
        let empty = wrap.querySelector(".empty");
        if (!empty) {
          empty = document.createElement("div");
          empty.className = "empty";
          wrap.appendChild(empty);
        }
        empty.textContent = "No orders yet. New orders from the sheet appear here automatically so you can mark LD or LC.";
        empty.hidden = false;
        return;
      }
      const empty = table.parentElement.querySelector(".empty");
      if (empty) empty.hidden = true;
      let weeks = "";
      let drow = "";
      let dates = "";
      let cursor = 0;
      while (cursor < days.length) {
        const w = weekLabel(days[cursor]);
        let n = 0;
        while (cursor + n < days.length && weekLabel(days[cursor + n]) === w) n++;
        weeks += "<th colspan=\"" + n + "\">" + w + "</th>";
        cursor += n;
      }
      days.forEach((d) => {
        drow += "<th class=\"day\">" + dow(d) + "</th>";
        dates += "<th class=\"day\">" + pretty(d) + "</th>";
      });
      let html = "<thead><tr><th colspan=\"" + LEFT.length + "\"></th>" + weeks + "</tr>";
      html += "<tr>";
      LEFT.forEach(([, l]) => html += "<th class=\"left\">" + l + "</th>");
      html += drow + "</tr><tr>";
      LEFT.forEach(() => html += "<th></th>");
      html += dates + "</tr></thead><tbody>";
      rows.forEach((row) => {
        html += "<tr data-id=\"" + row.id + "\">";
        LEFT.forEach(([k,, locked]) => {
          if (locked) {
            html += "<td class=\"left\"><span class=\"cell-text\" title=\"" + esc(row[k]) + "\">" + esc(row[k]) + "</span></td>";
          } else {
            html += "<td class=\"left\"><input data-k=\"" + k + "\" value=\"" + esc(row[k]) + "\"></td>";
          }
        });
        days.forEach((d) => {
          const v = (row.cells && row.cells[d]) || "";
          html += "<td class=\"day code-cell\" data-day=\"" + d + "\" data-code=\"" + esc(v) + "\" tabindex=\"0\" style=\"" + codeStyle(v) + "\">" + esc(v) + "</td>";
        });
        html += "</tr>";
      });
      html += "</tbody>";
      table.innerHTML = html;
      table.onchange = onChange;
      table.onclick = onGridClick;
      table.onkeydown = onGridKey;
    }

    function onGridClick(e) {
      const td = e.target.closest(".code-cell");
      if (td) { openPicker(td); return; }
      closePicker();
    }
    function onGridKey(e) {
      if (e.key === "Enter") {
        if (e.target.classList.contains("code-cell")) { e.preventDefault(); openPicker(e.target); }
        else e.target.blur();
      }
    }

    async function applyCode(value) {
      if (!pickCell) return;
      const td = pickCell;
      const tr = td.closest("tr");
      const id = Number(tr.getAttribute("data-id"));
      const day = td.getAttribute("data-day");
      const row = rows.find((r) => r.id === id);
      if (!row) return;
      if (!row.cells) row.cells = {};
      row.cells[day] = value;
      paintCell(td, value);
      closePicker();
      await sdOfficeFetch("/api/office/schedule/cell", {
        method: "PUT",
        body: JSON.stringify({ rowId: id, day, value })
      });
    }

    async function onChange(e) {
      if (!e.target.dataset.k) return;
      const tr = e.target.closest("tr");
      const id = Number(tr.getAttribute("data-id"));
      const row = rows.find((r) => r.id === id);
      if (!row) return;
      row[e.target.dataset.k] = e.target.value;
      await sdOfficeFetch("/api/office/schedule/row", {
        method: "PUT",
        body: JSON.stringify(row)
      });
    }

    async function load() {
      document.getElementById("status").textContent = "Loading orders…";
      closePicker();
      const r = await sdOfficeFetch("/api/office/schedule?start=" + encodeURIComponent(start));
      const j = await r.json();
      start = j.start;
      days = j.days;
      rows = j.rows;
      codes = j.codes || [];
      document.getElementById("status").textContent = rows.length + " orders · week of " + pretty(start);
      renderLegend();
      renderPicker();
      render();
    }
    function shift(n) {
      const d = new Date(start + "T12:00:00");
      d.setDate(d.getDate() + n);
      start = d.toISOString().slice(0, 10);
      load();
    }
    document.getElementById("picker").onclick = (e) => {
      const btn = e.target.closest("button[data-code]");
      if (btn) applyCode(btn.getAttribute("data-code"));
    };
    document.addEventListener("click", (e) => {
      if (e.target.closest("#picker") || e.target.closest(".code-cell")) return;
      closePicker();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePicker(); });
    sdRequireOffice("orders").then((p) => { if (p) load(); });
  </script>
</body>
</html>
