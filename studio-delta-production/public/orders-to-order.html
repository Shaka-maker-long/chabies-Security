<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Delta — To order</title>
  <script src="/sd-pwa.js?v=pwa"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --line:#d0d5dd; --head:#f2f4f7; --ink:#1d2939; --muted:#667085; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; color:var(--ink); background:#f8f9fc; }
    header { display:flex; gap:16px; align-items:flex-end; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header h1 { font-family: Outfit, Inter, sans-serif; font-size:18px; margin:0; }
    .lede { margin:4px 0 0; color:var(--muted); font-size:12px; max-width:720px; }
    .tabs { display:flex; gap:4px; flex-wrap:wrap; }
    .tabs a { font-size:13px; font-weight:600; color:#344054; text-decoration:none; padding:6px 10px; border-radius:6px; border:1px solid transparent; }
    .tabs a.on { background:#1d2939; color:#fff; }
    .tools { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button { border:1px solid #1d2939; background:#1d2939; color:#fff; border-radius:6px; padding:8px 12px; font-weight:600; cursor:pointer; font:inherit; font-size:13px; }
    button.ghost { background:#fff; color:#1d2939; }
    .page { padding:18px 16px 32px; }
    .subtabs { display:flex; gap:8px; margin:0 0 14px; }
    .subtabs button { border-radius:999px; }
    .subtabs button.off { background:#fff; color:#1d2939; }
    .empty, .load, .err { background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px 16px; text-align:center; color:var(--muted); }
    .err { color:#b42318; }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th, td { border:1px solid var(--line); padding:8px 10px; font-size:13px; text-align:left; }
    th { background:var(--head); font-size:11px; letter-spacing:.03em; text-transform:uppercase; }
    .pill { display:inline-block; border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; }
    .pill.to { background:#fffaeb; color:#b54708; }
    .pill.ok { background:#ecfdf3; color:#067647; }
    @media print {
      header .tabs, .tools, .subtabs, td button { display:none !important; }
      body { background:#fff; }
    }
    @media (max-width: 720px) {
      .tools { width:100%; margin-left:0; }
      table { font-size:12px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <nav class="tabs" aria-label="Orders views">
        <a href="/orders">Sheet</a>
        <a href="/orders/schedule">Production schedule</a>
        <a href="/orders/delivery">Delivery summary</a>
        <a href="/orders/job-card">Job card</a>
        <a class="on" href="/orders/to-order">To order</a>
      </nav>
      <h1>To order</h1>
      <p class="lede">Glass and wood logged at Pre-Powder Coating QC. Print this list when you raise a purchase order. Mark a line ordered after it is bought.</p>
    </div>
    <div class="tools">
      <span class="msg" id="status"></span>
      <button class="ghost" type="button" onclick="load()">Refresh</button>
      <button type="button" onclick="window.print()">Print list</button>
    </div>
  </header>
  <div class="page">
    <div class="subtabs">
      <button type="button" id="tabGlass" onclick="showKind('glass')">Glass</button>
      <button type="button" id="tabWood" class="off" onclick="showKind('wood')">Wood</button>
    </div>
    <div id="list"></div>
  </div>
  <script src="/office-auth.js?v=plain-copy"></script>
  <script>
    let data = { glass: [], wood: [] };
    let kind = "glass";
    function showKind(next) {
      kind = next;
      document.getElementById("tabGlass").classList.toggle("off", kind !== "glass");
      document.getElementById("tabWood").classList.toggle("off", kind !== "wood");
      render();
    }
    function fmtWhen(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleString("en-ZA", { timeZone: "Africa/Johannesburg", dateStyle: "medium", timeStyle: "short" });
    }
    function render() {
      const rows = (data[kind] || []).slice();
      const box = document.getElementById("list");
      if (!rows.length) {
        box.innerHTML = '<div class="empty">Nothing to order yet. Pre-Powder Coating QC adds glass (and wood if required) here.</div>';
        return;
      }
      const open = rows.filter((r) => r.status !== "Ordered").length;
      let html = '<p class="msg">' + open + ' still to buy · ' + rows.length + ' lines</p>';
      html += '<div style="overflow:auto"><table><thead><tr><th>Order</th><th>Component</th><th>Type</th><th>Thickness</th><th>Height</th><th>Width</th><th>Qty</th><th>Logged</th><th>Status</th><th></th></tr></thead><tbody>';
      rows.forEach((r) => {
        const ordered = r.status === "Ordered";
        html += '<tr><td><b>' + (r.order || "") + '</b></td><td>' + (r.component || "") + '</td><td>' + (r.type || "") +
          '</td><td>' + (r.thickness || "") + '</td><td>' + (r.height || "") + '</td><td>' + (r.width || "") +
          '</td><td>' + (r.quantity || "") + '</td><td>' + fmtWhen(r.timestamp) + '</td><td><span class="pill ' +
          (ordered ? "ok" : "to") + '">' + (r.status || "To order") + '</span></td><td>' +
          (ordered
            ? '<button class="ghost" type="button" onclick="mark(\'' + r.kind + '\',\'' + r.id + '\',\'To order\')">Back to order</button>'
            : '<button type="button" onclick="mark(\'' + r.kind + '\',\'' + r.id + '\',\'Ordered\')">Mark ordered</button>') +
          '</td></tr>';
      });
      html += '</tbody></table></div>';
      box.innerHTML = html;
    }
    async function mark(k, id, status) {
      const r = await sdOfficeFetch("/api/office/materials-to-order", {
        method: "PUT",
        body: JSON.stringify({ kind: k, id: id, status: status })
      });
      const j = await r.json();
      if (!j.ok) {
        document.getElementById("status").textContent = j.error || "Could not update";
        return;
      }
      await load();
    }
    async function load() {
      const box = document.getElementById("list");
      box.innerHTML = '<div class="load">Loading glass and wood to order…</div>';
      try {
        const r = await sdOfficeFetch("/api/office/materials-to-order");
        const j = await r.json();
        if (!j.ok) {
          box.innerHTML = '<div class="err">' + (j.error || "Could not load To order.") + '</div>';
          return;
        }
        data = { glass: j.glass || [], wood: j.wood || [] };
        document.getElementById("status").textContent = (data.glass.length + data.wood.length) + " lines";
        render();
      } catch (e) {
        box.innerHTML = '<div class="err">Could not load To order.</div>';
      }
    }
    sdRequireOffice("orders").then((p) => { if (p) load(); });
  </script>
</body>
</html>
