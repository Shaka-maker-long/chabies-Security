<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Delta — Enquiry process</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --line:#d0d5dd; --head:#f2f4f7; --ink:#1d2939; --muted:#667085; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; color:var(--ink); background:#f8f9fc; }
    header { display:flex; gap:16px; align-items:flex-end; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
    header h1 { font-family: Outfit, Inter, sans-serif; font-size:18px; margin:0; }
    .lede { margin:4px 0 0; color:var(--muted); font-size:12px; max-width:640px; }
    .tabs { display:flex; gap:4px; }
    .tabs a { font-size:13px; font-weight:600; color:#344054; text-decoration:none; padding:6px 10px; border-radius:6px; border:1px solid transparent; }
    .tabs a.on { background:#1d2939; color:#fff; }
    .wrap { padding:16px; }
    .board { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:auto; -webkit-overflow-scrolling:touch; }
    .board svg { display:block; min-width:1080px; width:100%; height:auto; }
    .legend { display:flex; gap:16px; flex-wrap:wrap; margin:12px 0 0; font-size:12px; color:var(--muted); }
    .legend span { display:flex; align-items:center; gap:6px; }
    .swatch { width:14px; height:14px; border:1.5px solid #1d2939; background:#fff; border-radius:3px; }
    .swatch.gw { transform:rotate(45deg); border-radius:1px; width:10px; height:10px; }
    .swatch.start { border-radius:50%; border-color:#027a48; }
    .swatch.end { border-radius:50%; border-width:3px; }
    .swatch.loop { border-color:#b54708; background:#fffaeb; }
    @media (max-width: 720px) {
      header { align-items:flex-start; }
      .board { margin:0 -16px; border-radius:0; border-left:0; border-right:0; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="tabs" aria-label="Enquiries views">
      <a href="/enquiries">Sheet</a>
      <a href="/enquiries/dashboard">Dashboard</a>
      <a class="on" href="/enquiries/process">Process</a>
    </nav>
    <div>
      <h1>Enquiry process</h1>
      <p class="lede">BPMN of STATUS · update. One enquiry can carry more than one quote. Outlook mail can be saved at any open step.</p>
    </div>
  </header>
  <div class="wrap">
    <div class="board" role="img" aria-label="BPMN diagram of the Studio Delta enquiry process">
      <svg viewBox="0 0 1100 1120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M1 1 L11 6 L1 11 Z" fill="#1d2939"/>
          </marker>
          <marker id="arrowLoop" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M1 1 L11 6 L1 11 Z" fill="#b54708"/>
          </marker>
          <style>
            .lane { fill:#f8fafc; stroke:#d0d5dd; }
            .lane2 { fill:#fff; stroke:#d0d5dd; }
            .pool { fill:none; stroke:#1d2939; stroke-width:1.4; }
            .lbl { font-family:Inter,system-ui,sans-serif; fill:#667085; font-size:11px; font-weight:700; letter-spacing:.08em; }
            .t { font-family:Inter,system-ui,sans-serif; fill:#1d2939; font-size:12px; font-weight:600; }
            .s { font-family:Inter,system-ui,sans-serif; fill:#667085; font-size:10px; font-weight:600; }
            .task { fill:#fff; stroke:#1d2939; stroke-width:1.4; }
            .taskLoop { fill:#fffaeb; stroke:#b54708; stroke-width:1.6; }
            .gw { fill:#fff; stroke:#1d2939; stroke-width:1.4; }
            .flow { fill:none; stroke:#1d2939; stroke-width:1.35; marker-end:url(#arrow); }
            .loop { fill:none; stroke:#b54708; stroke-width:1.5; marker-end:url(#arrowLoop); }
            .fl { font-family:Inter,system-ui,sans-serif; fill:#344054; font-size:10px; font-weight:600; }
            .flLoop { fill:#b54708; }
          </style>
        </defs>

        <rect class="lane" x="40" y="36" width="1040" height="232"/>
        <rect class="lane2" x="40" y="268" width="1040" height="272"/>
        <rect class="lane" x="40" y="540" width="1040" height="312"/>
        <rect class="lane2" x="40" y="852" width="1040" height="232"/>
        <rect class="pool" x="40" y="36" width="1040" height="1048" rx="4"/>
        <line x1="156" y1="36" x2="156" y2="1084" stroke="#1d2939" stroke-width="1.2"/>
        <text class="lbl" transform="translate(78 152) rotate(-90)" text-anchor="middle">CAPTURE</text>
        <text class="lbl" transform="translate(78 404) rotate(-90)" text-anchor="middle">COSTING</text>
        <text class="lbl" transform="translate(78 696) rotate(-90)" text-anchor="middle">QUOTE</text>
        <text class="lbl" transform="translate(78 968) rotate(-90)" text-anchor="middle">ORDER</text>
        <text class="lbl" x="168" y="28" fill="#1d2939" letter-spacing=".12em">STUDIO DELTA — ENQUIRY</text>

        <!-- Capture -->
        <circle cx="230" cy="130" r="12" fill="#fff" stroke="#027a48" stroke-width="2.2"/>
        <rect class="task" x="268" y="106" width="156" height="48" rx="10"/>
        <text class="t" x="346" y="128" text-anchor="middle">Capture enquiry</text>
        <text class="s" x="346" y="143" text-anchor="middle">New</text>

        <path class="gw" d="M502 130 L526 106 L550 130 L526 154 Z"/>
        <path d="M518 122 L534 138 M534 122 L518 138" fill="none" stroke="#1d2939" stroke-width="1.4"/>
        <text class="fl" x="526" y="92" text-anchor="middle">Ready to cost?</text>

        <rect class="task" x="600" y="64" width="156" height="44" rx="10"/>
        <text class="t" x="678" y="90" text-anchor="middle">Chase missing info</text>
        <rect class="task" x="600" y="152" width="156" height="44" rx="10"/>
        <text class="t" x="678" y="172" text-anchor="middle">Close enquiry</text>
        <text class="s" x="678" y="186" text-anchor="middle">Not interested / not in scope</text>
        <circle cx="830" cy="174" r="11" fill="#fff" stroke="#1d2939" stroke-width="2"/>
        <circle cx="830" cy="174" r="7" fill="#fff" stroke="#1d2939" stroke-width="1.6"/>

        <rect class="task" x="268" y="208" width="156" height="44" rx="10"/>
        <text class="t" x="346" y="234" text-anchor="middle">Assign costing</text>

        <path class="flow" d="M242 130 H268"/>
        <path class="flow" d="M424 130 H502"/>
        <path class="loop" d="M526 106 V86 H600"/>
        <text class="fl flLoop" x="548" y="80">no</text>
        <path class="loop" d="M600 86 H250 V106"/>
        <path class="flow" d="M526 154 V174 H600"/>
        <text class="fl" x="548" y="170">close</text>
        <path class="flow" d="M756 174 H819"/>
        <path class="flow" d="M526 154 V230 H424"/>
        <text class="fl" x="500" y="200">yes</text>

        <!-- Costing -->
        <rect class="task" x="268" y="300" width="156" height="48" rx="10"/>
        <text class="t" x="346" y="322" text-anchor="middle">Costing / Re-Cost</text>
        <text class="s" x="346" y="337" text-anchor="middle">Upload cost sheet</text>

        <path class="gw" d="M502 324 L526 300 L550 324 L526 348 Z"/>
        <path d="M518 316 L534 332 M534 316 L518 332" fill="none" stroke="#1d2939" stroke-width="1.4"/>
        <text class="fl" x="526" y="286" text-anchor="middle">Supplier wait?</text>

        <rect class="task" x="600" y="258" width="156" height="44" rx="10"/>
        <text class="t" x="678" y="284" text-anchor="middle">Waiting on supplier</text>

        <rect class="task" x="600" y="348" width="156" height="48" rx="10"/>
        <text class="t" x="678" y="370" text-anchor="middle">Cost sheet saved</text>
        <text class="s" x="678" y="385" text-anchor="middle">Choose quoting person</text>

        <path class="gw" d="M834 372 L858 348 L882 372 L858 396 Z"/>
        <path d="M850 364 L866 380 M866 364 L850 380" fill="none" stroke="#1d2939" stroke-width="1.4"/>
        <text class="fl" x="858" y="334" text-anchor="middle">Approval?</text>

        <rect class="taskLoop" x="790" y="430" width="156" height="44" rx="10"/>
        <text class="t" x="868" y="456" text-anchor="middle">Reject → Re-Cost</text>

        <path class="flow" d="M346 252 V300"/>
        <path class="flow" d="M424 324 H502"/>
        <path class="loop" d="M526 300 V280 H600"/>
        <text class="fl flLoop" x="548" y="274">yes</text>
        <path class="loop" d="M600 280 H250 V324 H268"/>
        <path class="flow" d="M550 324 H600"/>
        <text class="fl" x="568" y="318">no</text>
        <path class="flow" d="M756 372 H834"/>
        <path class="loop" d="M858 396 V452 H790"/>
        <text class="fl flLoop" x="900" y="424">reject</text>
        <path class="loop" d="M790 452 H210 V324 H268"/>
        <path class="flow" d="M858 396 V560 H424"/>
        <text class="fl" x="900" y="520">approve / skip</text>

        <!-- Quote -->
        <rect class="task" x="268" y="584" width="156" height="48" rx="10"/>
        <text class="t" x="346" y="606" text-anchor="middle">Issue quote PDF</text>
        <text class="s" x="346" y="621" text-anchor="middle">SOQ + values excl VAT</text>

        <path class="gw" d="M502 608 L526 584 L550 608 L526 632 Z"/>
        <path d="M518 600 L534 616 M534 600 L518 616" fill="none" stroke="#1d2939" stroke-width="1.4"/>
        <text class="fl" x="526" y="570" text-anchor="middle">Client on this quote?</text>

        <rect class="taskLoop" x="600" y="548" width="168" height="44" rx="10"/>
        <text class="t" x="684" y="574" text-anchor="middle">Issue another quote</text>
        <rect class="taskLoop" x="600" y="604" width="168" height="44" rx="10"/>
        <text class="t" x="684" y="630" text-anchor="middle">Client wants changes</text>
        <rect class="task" x="600" y="660" width="168" height="44" rx="10"/>
        <text class="t" x="684" y="686" text-anchor="middle">Follow-up screenshot</text>
        <rect class="task" x="600" y="716" width="168" height="44" rx="10"/>
        <text class="t" x="684" y="736" text-anchor="middle">Client rejected</text>
        <text class="s" x="684" y="750" text-anchor="middle">Reason required</text>
        <circle cx="850" cy="738" r="11" fill="#fff" stroke="#b42318" stroke-width="2"/>
        <circle cx="850" cy="738" r="7" fill="#fff" stroke="#b42318" stroke-width="1.6"/>

        <rect class="task" x="268" y="700" width="156" height="44" rx="10"/>
        <text class="t" x="346" y="726" text-anchor="middle">Attach POP</text>

        <path class="flow" d="M424 608 H502"/>
        <path class="loop" d="M526 584 V570 H600"/>
        <text class="fl flLoop" x="560" y="564">another quote</text>
        <path class="loop" d="M600 570 H250 V608 H268"/>
        <path class="loop" d="M550 608 H600"/>
        <text class="fl flLoop" x="572" y="602">recost</text>
        <path class="loop" d="M600 626 H198 V324 H268"/>
        <path class="flow" d="M526 632 V682 H600"/>
        <text class="fl" x="548" y="656">follow up</text>
        <path class="loop" d="M768 682 H900 V608 H550"/>
        <path class="flow" d="M526 632 V738 H600"/>
        <text class="fl" x="548" y="720">rejected</text>
        <path class="flow" d="M768 738 H839"/>
        <path class="flow" d="M526 632 V722 H424"/>
        <text class="fl" x="500" y="690">approved</text>

        <text class="s" x="684" y="538" text-anchor="middle">Same enquiry. New SOQ. Old PDFs stay in Files.</text>

        <!-- Order -->
        <rect class="task" x="268" y="892" width="156" height="48" rx="10"/>
        <text class="t" x="346" y="914" text-anchor="middle">Ordered</text>
        <text class="s" x="346" y="929" text-anchor="middle">Proof of payment saved</text>

        <path class="gw" d="M502 916 L526 892 L550 916 L526 940 Z"/>
        <path d="M518 908 L534 924 M534 908 L518 924" fill="none" stroke="#1d2939" stroke-width="1.4"/>
        <text class="fl" x="526" y="878" text-anchor="middle">Drawing required?</text>

        <rect class="task" x="600" y="892" width="156" height="48" rx="10"/>
        <text class="t" x="678" y="914" text-anchor="middle">Upload drawing</text>
        <text class="s" x="678" y="929" text-anchor="middle">Then ready for Orders</text>

        <circle cx="346" cy="1028" r="12" fill="#fff" stroke="#027a48" stroke-width="2.2"/>
        <circle cx="346" cy="1028" r="7" fill="#fff" stroke="#027a48" stroke-width="1.8"/>
        <text class="s" x="346" y="1060" text-anchor="middle">Ready for Orders</text>
        <circle cx="678" cy="1028" r="12" fill="#fff" stroke="#027a48" stroke-width="2.2"/>
        <circle cx="678" cy="1028" r="7" fill="#fff" stroke="#027a48" stroke-width="1.8"/>
        <text class="s" x="678" y="1060" text-anchor="middle">Ready for Orders</text>

        <path class="flow" d="M346 744 V892"/>
        <path class="flow" d="M424 916 H502"/>
        <path class="flow" d="M550 916 H600"/>
        <text class="fl" x="572" y="910">yes</text>
        <path class="flow" d="M526 940 V1028 H358"/>
        <text class="fl" x="500" y="980">no</text>
        <path class="flow" d="M678 940 V1016"/>
      </svg>
    </div>
    <div class="legend">
      <span><i class="swatch start"></i> Start / happy end</span>
      <span><i class="swatch end"></i> End</span>
      <span><i class="swatch"></i> Task (STATUS · update)</span>
      <span><i class="swatch gw"></i> Exclusive gateway</span>
      <span><i class="swatch loop"></i> Same enquiry — another quote or recost</span>
    </div>
  </div>
  <script src="/office-auth.js?v=login-users"></script>
  <script>sdRequireOffice("enquiries");</script>
</body>
</html>
