<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Delta — Monthly pack</title>
  <script src="/sd-pwa.js?v=pwa-committed-banner"></script>
  <style>
    :root { --ink:#101828; --muted:#667085; --line:#e4e7ec; --bg:#f8f9fc; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    header.bar { display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; padding:12px 16px; background:#fff; border-bottom:2px solid #000; }
    header.bar h1 { margin:0; font-family: Outfit, Inter, sans-serif; font-size:18px; letter-spacing:.06em; text-transform:uppercase; }
    .lede { margin:4px 0 0; color:var(--muted); font-size:12px; max-width:720px; }
    .tabs { display:flex; gap:4px; flex-wrap:wrap; }
    .tabs a { font-size:13px; font-weight:600; color:#344054; text-decoration:none; padding:6px 10px; border-radius:6px; }
    .tabs a.on { background:#1d2939; color:#fff; }
    .tools { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    select, button { font:inherit; font-size:13px; }
    select { border:1px solid #000; background:#fff; padding:6px 8px; }
    button { border:1px solid #000; background:#000; color:#fff; padding:6px 12px; font-weight:700; cursor:pointer; }
    button.ghost { background:#fff; color:#000; }
    .page { padding:16px; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
    .kpi { background:#fff; border:1px solid var(--line); padding:12px 14px; }
    .kpi span { display:block; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
    .kpi b { display:block; margin-top:4px; font-size:22px; font-family: Outfit, Inter, sans-serif; }
    .people { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
    .pack-block { margin-top:28px; }
    .pack-block h2 { margin:0 0 8px; font-size:14px; letter-spacing:.08em; text-transform:uppercase; }
    .sheet { background:#fff; border:1px solid var(--line); padding:12px 16px; margin-top:12px; overflow:auto; }
    .card { background:#fff; border:1px solid var(--line); padding:14px 16px; break-inside:avoid; page-break-inside:avoid; }
    .card h2 { margin:0 0 4px; font-size:16px; }
    .card .meta { color:var(--muted); font-size:12px; margin-bottom:10px; }
    .badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .badge { background:#f2f4f7; font-size:11px; font-weight:700; padding:4px 8px; }
    .badge.ot { background:#fff7ed; }
    .badge.none { background:#fef3f2; color:#b42318; }
    .badge.orders { cursor:pointer; background:#1d2939; color:#fff; border:0; font:inherit; font-size:11px; font-weight:700; padding:4px 8px; }
    .badge.orders:disabled { cursor:default; background:#f2f4f7; color:var(--ink); }
    tr.station { cursor:pointer; }
    tr.station:hover td { background:#f2f4f7; }
    .mask { position:fixed; inset:0; background:rgba(16,24,40,.45); z-index:40; display:none; padding:24px 12px; overflow:auto; }
    .mask.open { display:block; }
    .modal { background:#fff; max-width:820px; margin:0 auto; border:2px solid #000; }
    .modal header { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 16px; background:#000; color:#fff; }
    .modal header h2 { margin:0; font-size:14px; letter-spacing:.06em; text-transform:uppercase; }
    .modal .body { padding:16px; max-height:70vh; overflow:auto; }
    .product-clip[data-product-shot] { cursor:help; text-decoration: underline dotted rgba(29,41,57,.35); text-underline-offset:2px; }
    #productShot {
      position:fixed; z-index:80; width:min(280px, calc(100vw - 24px));
      background:#fff; border:1px solid var(--line); padding:8px; pointer-events:none;
      box-shadow:0 12px 32px rgba(16,24,40,.2);
    }
    #productShot[hidden] { display:none !important; }
    #productShot img { display:block; width:100%; height:auto; max-height:280px; object-fit:contain; background:#f8f9fc; }
    #productShot .product-shot-name { margin:8px 2px 2px; font-size:12px; font-weight:700; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { padding:4px 0; border-bottom:1px solid var(--line); text-align:left; }
    th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
    td.r, th.r { text-align:right; }
    .tasks { margin:8px 0 0; padding-left:16px; font-size:12px; }
    .tasks li { margin:0 0 4px; }
    .load, .err { padding:40px; text-align:center; color:var(--muted); }
    .err { color:#b42318; }
    .cover { background:#000; color:#fff; padding:20px; margin-bottom:14px; }
    .cover h2 { margin:0 0 6px; font-family: Outfit, Inter, sans-serif; font-size:22px; letter-spacing:.04em; text-transform:uppercase; }
    .cover p { margin:0; color:#d0d5dd; font-size:13px; max-width:640px; }
    @media print {
      body { background:#fff; }
      header.bar .tabs, header.bar .tools button.ghost, .no-print, .mask { display:none !important; }
      .page { padding:0; }
      .card { border:1px solid #000; }
      .cover { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }
    @media (max-width: 700px) {
      .people { grid-template-columns:1fr; }
      .tools { width:100%; margin-left:0; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div>
      <nav class="tabs">
        <a href="/ops">Ops hub</a>
        <a href="/?view=activity">Activity (hours)</a>
        <a class="on" href="/shop-month">Month pack</a>
        <a href="/orders">Orders</a>
      </nav>
      <h1>Studio Delta // <span>Monthly pack</span></h1>
      <p class="lede">Shop floor and Sales for the month. Shop cards use stations and unique orders. Sales cards use client work, costing, quotes, drawings, and orders added. Paid shop shift is 07:45–15:45 minus lunch.</p>
    </div>
    <div class="tools no-print">
      <label>Month <input type="month" id="monthPick" onchange="load()"></label>
      <button type="button" class="ghost" onclick="load()">Refresh</button>
      <button type="button" onclick="window.print()">Print pack</button>
    </div>
  </header>
  <div class="page">
    <div id="load" class="load">Loading month pack…</div>
    <div id="err" class="err" hidden></div>
    <div id="app" hidden></div>
  </div>
  <div class="mask no-print" id="orderMask" onclick="if(event.target.id==='orderMask')closeOrders()">
    <div class="modal">
      <header>
        <h2 id="orderTitle">Orders</h2>
        <button type="button" class="ghost" onclick="closeOrders()">Close</button>
      </header>
      <div class="body" id="orderBody"></div>
    </div>
  </div>
  <div id="productShot" hidden>
    <img alt="">
    <p class="product-shot-name"></p>
  </div>
  <script src="/office-auth.js?v=login-msg-3"></script>
  <script>
    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
    }
    function hm(mins) {
      const n = Math.max(0, Math.round(Number(mins || 0)));
      const h = Math.floor(n / 60);
      const m = n % 60;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }
    function defaultMonth() {
      const now = new Date(Date.now() + 2 * 60 * 60 * 1000);
      return now.getUTCFullYear() + "-" + String(now.getUTCMonth() + 1).padStart(2, "0");
    }
    let PEOPLE = [];
    let SALES = [];
    let ADDED = [];
    function isIndirect(t) {
      if (!t) return true;
      if (String(t.entryType || "") === "indirect") return true;
      if (!String(t.order || "").trim()) return true;
      return String(t.role || t.task || "").toLowerCase() === "indirect";
    }
    function orderLineId(raw) {
      const s = String(raw || "").trim().toUpperCase().replace(/\s+/g, " ");
      if (!s) return "";
      const tagged = s.match(/^(S\d+)\s*([A-Z])$/);
      if (tagged) return tagged[1] + " " + tagged[2];
      return s;
    }
    function stationOf(t) {
      return String(t.role || t.task || "Other").trim() || "Other";
    }
    function groupOrderRows(tasks) {
      const map = {};
      (tasks || []).forEach((t) => {
        if (isIndirect(t)) return;
        const line = t.orderLine || orderLineId(t.order);
        const task = String(t.task || t.role || "").trim() || "Work";
        const key = line + "\0" + task;
        if (!map[key]) {
          map[key] = { order: line, product: t.product || "", imageUrl: t.imageUrl || "", task: task, minutes: 0, running: false };
        }
        map[key].minutes += Number(t.minutes || 0);
        if (t.product) map[key].product = t.product;
        if (t.imageUrl) map[key].imageUrl = t.imageUrl;
        if (!t.end) map[key].running = true;
      });
      return Object.keys(map).map((k) => map[k]).sort((a, b) => {
        if (a.order !== b.order) return String(a.order).localeCompare(String(b.order));
        return String(a.task).localeCompare(String(b.task));
      });
    }
    function indirectName(t) {
      const task = String(t.task || "").trim();
      const role = String(t.role || "").trim();
      if (task && task.toLowerCase() !== "indirect") return task;
      if (role && role.toLowerCase() !== "indirect") return role;
      return "Indirect";
    }
    function groupIndirectRows(tasks) {
      const map = {};
      (tasks || []).forEach((t) => {
        if (!isIndirect(t)) return;
        const label = indirectName(t);
        if (!map[label]) map[label] = { task: label, minutes: 0 };
        map[label].minutes += Number(t.minutes || 0);
      });
      return Object.keys(map).map((k) => map[k]).sort((a, b) => b.minutes - a.minutes);
    }
    function personCard(p, i) {
      const badges = [];
      badges.push("<span class='badge'>" + hm(p.totalMinutes) + " total</span>");
      badges.push("<span class='badge'>" + hm(p.totalRegular) + " regular</span>");
      if (p.totalOvertime) badges.push("<span class='badge ot'>OT " + hm(p.totalOvertime) + "</span>");
      badges.push("<span class='badge'>" + p.daysWorked + " day" + (p.daysWorked === 1 ? "" : "s") + "</span>");
      if (p.orderCount) {
        badges.push("<button type='button' class='badge orders' data-person='" + i + "'>" + p.orderCount + " order" + (p.orderCount === 1 ? "" : "s") + "</button>");
      } else {
        badges.push("<span class='badge'>0 orders</span>");
      }
      if (!p.clocked) badges.push("<span class='badge none'>No orders this month</span>");
      let proc = "";
      if (p.processes.length) {
        proc = "<table><thead><tr><th>Station</th><th class='r'>Orders</th><th class='r'>Time</th></tr></thead><tbody>" +
          p.processes.map((r) => {
            const qty = r.indirect ? (r.taskCount || r.count || 0) : (r.orderCount || r.count || 0);
            const qtyLabel = r.indirect ? (qty + " task" + (qty === 1 ? "" : "s")) : qty;
            return "<tr class='station' data-person='" + i + "' data-station=\"" + esc(r.name) + "\"><td>" + esc(r.name) + "</td><td class='r'>" + qtyLabel + "</td><td class='r'>" + hm(r.minutes) + "</td></tr>";
          }).join("") +
          "</tbody></table>";
      }
      return "<article class='card'><h2>" + esc(p.worker) + "</h2><div class='meta'>" + esc(p.role || "Shop") +
        (p.orderCount ? (" · " + p.orderCount + " order" + (p.orderCount === 1 ? "" : "s")) : "") +
        "</div><div class='badges'>" + badges.join("") + "</div>" + proc + "</article>";
    }
    function productCell(t) {
      const name = t.product || "—";
      if (t.imageUrl) {
        return "<span class='product-clip' data-product-shot=\"" + esc(t.imageUrl) + "\">" + esc(name) + "</span>";
      }
      return esc(name);
    }
    function showModal(title, html) {
      document.getElementById("orderTitle").textContent = title;
      document.getElementById("orderBody").innerHTML = html;
      document.getElementById("orderMask").classList.add("open");
    }
    function openOrders(i, station) {
      const p = PEOPLE[i];
      if (!p) return;
      let tasks = p.tasks || [];
      if (station) tasks = tasks.filter((t) => stationOf(t) === station);
      const indirectStation = String(station || "").toLowerCase() === "indirect";
      if (indirectStation || (station && tasks.every(isIndirect))) {
        const rows = groupIndirectRows(tasks.length ? tasks : (p.tasks || []).filter(isIndirect));
        if (!rows.length) {
          showModal(p.worker + " — Indirect", "<p class='lede'>No indirect tasks this month.</p>");
          return;
        }
        showModal(p.worker + " — Indirect",
          "<table><thead><tr><th>Task</th><th class='r'>Duration</th></tr></thead><tbody>" +
          rows.map((t) => "<tr><td>" + esc(t.task) + "</td><td class='r'>" + hm(t.minutes) + "</td></tr>").join("") +
          "</tbody></table>");
        return;
      }
      const rows = groupOrderRows(tasks);
      const label = station ? (p.worker + " — " + station) : (p.worker + " — orders this month");
      if (!rows.length) {
        showModal(label, "<p class='lede'>No order work in this view.</p>");
        return;
      }
      showModal(label,
        "<table><thead><tr><th>Order</th><th>Product</th><th>Task</th><th class='r'>Duration</th></tr></thead><tbody>" +
        rows.map((t) => "<tr><td>" + esc(t.order) + "</td><td>" + productCell(t) + "</td><td>" + esc(t.task) +
          (t.running ? " (running)" : "") + "</td><td class='r'>" + hm(t.minutes) + "</td></tr>").join("") +
        "</tbody></table>");
    }
    function closeOrders() {
      document.getElementById("orderMask").classList.remove("open");
      hideProductShot();
    }
    function showProductShot(url, label, x, y, anchor) {
      const box = document.getElementById("productShot");
      const img = box.querySelector("img");
      const name = box.querySelector(".product-shot-name");
      if (img.getAttribute("src") !== url) img.src = url;
      name.textContent = label || "";
      box.hidden = false;
      const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : { left: x, right: x + 8, top: y, bottom: y };
      const w = box.offsetWidth || 280;
      const left = Math.min(window.innerWidth - w - 12, Math.max(12, r.right + 8));
      const top = Math.min(window.innerHeight - 220, Math.max(12, r.top));
      box.style.left = left + "px";
      box.style.top = top + "px";
    }
    function hideProductShot() {
      document.getElementById("productShot").hidden = true;
    }
    function salesCard(p, i) {
      const badges = [];
      if (p.captured) badges.push("<button type='button' class='badge orders' data-sales='" + i + "' data-kind='captured'>" + p.captured + " captured</button>");
      if (p.quoted) badges.push("<button type='button' class='badge orders' data-sales='" + i + "' data-kind='quoted'>" + p.quoted + " quoted</button>");
      if (p.followed) badges.push("<button type='button' class='badge orders' data-sales='" + i + "' data-kind='followed'>" + p.followed + " followed up</button>");
      if (p.costing) badges.push("<button type='button' class='badge orders' data-sales='" + i + "' data-kind='costing'>" + p.costing + " costing</button>");
      if (p.ordered) badges.push("<button type='button' class='badge orders' data-sales='" + i + "' data-kind='ordered'>" + p.ordered + " client ordered</button>");
      if (p.added) badges.push("<button type='button' class='badge orders' data-sales='" + i + "' data-kind='added'>" + p.added + " added to Orders</button>");
      if (p.drawing) badges.push("<button type='button' class='badge orders' data-sales='" + i + "' data-kind='drawing'>" + p.drawing + " drawing" + (p.drawing === 1 ? "" : "s") + "</button>");
      if (p.approval) badges.push("<button type='button' class='badge orders' data-sales='" + i + "' data-kind='approval'>" + p.approval + " drawing approval" + (p.approval === 1 ? "" : "s") + "</button>");
      if (!p.worked) badges.push("<span class='badge none'>No sales work this month</span>");
      let proc = "";
      if (p.kinds && p.kinds.length) {
        proc = "<table><thead><tr><th>Work</th><th class='r'>Count</th></tr></thead><tbody>" +
          p.kinds.map((r) => "<tr class='station' data-sales='" + i + "' data-kind=\"" + esc(r.key) + "\"><td>" + esc(r.name) + "</td><td class='r'>" + r.count + "</td></tr>").join("") +
          "</tbody></table>";
      }
      return "<article class='card'><h2>" + esc(p.worker) + "</h2><div class='meta'>" + esc(p.role || "Sales") + "</div><div class='badges'>" + badges.join("") + "</div>" + proc + "</article>";
    }
    function openSales(i, kind) {
      const p = SALES[i];
      if (!p) return;
      const rows = (p.rows || []).filter((r) => !kind || r.kind === kind);
      const title = kind ? (p.worker + " — " + (rows[0] && rows[0].kindLabel || kind)) : (p.worker + " — sales this month");
      if (!rows.length) {
        showModal(title, "<p class='lede'>Nothing in this view.</p>");
        return;
      }
      showModal(title,
        "<table><thead><tr><th>When</th><th>Enquiry</th><th>Client</th><th>Product</th><th>Order</th></tr></thead><tbody>" +
        rows.map((r) => "<tr><td>" + esc(r.atLabel || r.at) + "</td><td>" + esc(r.enquiry_no) + "</td><td>" + esc(r.client) + "</td><td>" + esc(r.product) + "</td><td>" + esc(r.order) + "</td></tr>").join("") +
        "</tbody></table>");
    }
    function openAdded() {
      if (!ADDED.length) {
        showModal("Orders added", "<p class='lede'>No orders were stamped as added to the system this month.</p>");
        return;
      }
      showModal("Time to add orders",
        "<table><thead><tr><th>Order</th><th>Product</th><th>Added by</th><th>Ready for Orders</th><th>Added</th><th class='r'>Time to add</th></tr></thead><tbody>" +
        ADDED.map((r) => "<tr><td>" + esc(r.order) + "</td><td>" + esc(r.product) + "</td><td>" + esc(r.by || "—") + "</td><td>" + esc(r.readyLabel || "—") + "</td><td>" + esc(r.atLabel || "—") + "</td><td class='r'>" + esc(r.lagLabel) + "</td></tr>").join("") +
        "</tbody></table>" +
        "<p class='lede' style='margin-top:10px'>Time to add is from proof of payment (ready for Orders) until someone saved the Orders row. Older jobs without a stamp show as not timed.</p>");
    }
    function salesBlock(sales) {
      if (!sales) return "";
      const lagNote = sales.timedCount
        ? ("Median time to add an order was " + esc(sales.medianLagLabel) +
          (sales.averageLagLabel ? (" (average " + esc(sales.averageLagLabel) + ")") : "") +
          ". " + sales.timedCount + " timed" +
          (sales.untimedCount ? (", " + sales.untimedCount + " not timed") : "") + ".")
        : (sales.addedCount ? "Orders were added this month but older rows were not timed." : "New orders are timed from the moment POP is saved until the Orders row is created.");
      return "<div class='pack-block'>" +
        "<div class='cover'><h2>Sales</h2><p>What Sales did this month: captured enquiries, costing, quotes, follow-ups, drawings, drawing approval, client orders, and Orders rows added. Click a count. Time to add is POP to Orders, not shop clock time.</p></div>" +
        "<div class='kpis'>" +
        "<div class='kpi'><span>On the pack</span><b>" + sales.headcount + "</b></div>" +
        "<div class='kpi'><span>Worked</span><b>" + sales.workedCount + "</b></div>" +
        "<div class='kpi'><span>Captured</span><b>" + sales.captured + "</b></div>" +
        "<div class='kpi'><span>Costing</span><b>" + (sales.costing || 0) + "</b></div>" +
        "<div class='kpi'><span>Quoted</span><b>" + sales.quoted + "</b></div>" +
        "<div class='kpi'><span>Drawings</span><b>" + (sales.drawing || 0) + "</b></div>" +
        "<div class='kpi'><span>Client ordered</span><b>" + sales.ordered + "</b></div>" +
        "<div class='kpi'><span>Orders added</span><b>" + sales.addedCount + "</b></div>" +
        "<div class='kpi'><span>Median time to add</span><b>" + (sales.medianLagLabel || "—") + "</b></div>" +
        "</div>" +
        "<p class='lede' style='margin:0 0 12px'>" + lagNote + "</p>" +
        "<div class='people'>" + (sales.people || []).map(salesCard).join("") + "</div>" +
        (sales.addedCount
          ? ("<div class='sheet'><p class='lede' style='margin:0 0 8px'><button type='button' class='badge orders' id='openAdded'>Open time-to-add list</button> " +
            sales.addedCount + " order" + (sales.addedCount === 1 ? "" : "s") + " added to the system this month.</p></div>")
          : "") +
        "</div>";
    }
    function render(data) {
      const stations = (data.stations || []).slice(0, 8).map((s) => esc(s.name) + " " + hm(s.minutes)).join(" · ");
      const html =
        "<div class='cover'><h2>" + esc(data.title) + "</h2><p>Shop orders for every production employee. Click a station or the order count. Repeat sessions of the same line count as one order. A and B lines are separate orders. Station orders can overlap, so they do not add up to the badge. Indirect shows task names, not orders.</p></div>" +
        "<div class='kpis'>" +
        "<div class='kpi'><span>People on the pack</span><b>" + data.headcount + "</b></div>" +
        "<div class='kpi'><span>Worked</span><b>" + data.clockedCount + "</b></div>" +
        "<div class='kpi'><span>No orders</span><b>" + data.absentCount + "</b></div>" +
        "<div class='kpi'><span>Regular</span><b>" + hm(data.totalRegular) + "</b></div>" +
        "<div class='kpi'><span>Overtime</span><b>" + hm(data.totalOvertime) + "</b></div>" +
        "<div class='kpi'><span>Orders touched</span><b>" + data.orderCount + "</b></div>" +
        "</div>" +
        "<p class='lede' style='margin:0 0 12px'>" +
        (data.busiest ? ("Busiest: " + esc(data.busiest.worker) + " (" + hm(data.busiest.minutes) + "). ") : "") +
        (data.topStation ? ("Heaviest station: " + esc(data.topStation.name) + " (" + hm(data.topStation.minutes) + "). ") : "") +
        (stations ? ("Station mix: " + stations + ".") : "") +
        "</p>" +
        "<div class='people'>" + (data.people || []).map(personCard).join("") + "</div>" +
        salesBlock(data.sales);
      PEOPLE = data.people || [];
      SALES = (data.sales && data.sales.people) || [];
      ADDED = (data.sales && data.sales.added) || [];
      document.getElementById("app").innerHTML = html;
      document.querySelectorAll(".badge.orders").forEach((btn) => {
        if (btn.id === "openAdded") {
          btn.addEventListener("click", openAdded);
          return;
        }
        if (btn.hasAttribute("data-sales")) {
          btn.addEventListener("click", () => openSales(Number(btn.getAttribute("data-sales")), btn.getAttribute("data-kind")));
          return;
        }
        btn.addEventListener("click", () => openOrders(Number(btn.getAttribute("data-person"))));
      });
      document.querySelectorAll("tr.station").forEach((row) => {
        if (row.hasAttribute("data-sales")) {
          row.addEventListener("click", () => openSales(Number(row.getAttribute("data-sales")), row.getAttribute("data-kind")));
          return;
        }
        row.addEventListener("click", () => openOrders(Number(row.getAttribute("data-person")), row.getAttribute("data-station")));
      });
    }
    async function load() {
      document.getElementById("load").hidden = false;
      document.getElementById("err").hidden = true;
      document.getElementById("app").hidden = true;
      const monthEl = document.getElementById("monthPick");
      if (!monthEl.value) monthEl.value = defaultMonth();
      try {
        const r = await sdOfficeFetch("/api/office/shop-month?month=" + encodeURIComponent(monthEl.value));
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || "Could not load month pack");
        render(j);
        document.getElementById("load").hidden = true;
        document.getElementById("app").hidden = false;
      } catch (e) {
        document.getElementById("load").hidden = true;
        const err = document.getElementById("err");
        err.hidden = false;
        err.textContent = (e && e.message) || "Could not load month pack.";
      }
    }
    document.addEventListener("pointerover", (e) => {
      const hit = e.target.closest && e.target.closest("[data-product-shot]");
      if (!hit) return;
      showProductShot(hit.getAttribute("data-product-shot"), String(hit.textContent || "").trim(), 0, 0, hit);
    });
    document.addEventListener("pointerout", (e) => {
      const from = e.target.closest && e.target.closest("[data-product-shot]");
      const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest("[data-product-shot]") : null;
      if (from && from !== to) hideProductShot();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeOrders();
    });
    sdRequireOffice("ops").then(load);
  </script>
</body>
</html>
