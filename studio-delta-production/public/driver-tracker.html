<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Delta — Driver tracker</title>
  <script src="/sd-pwa.js?v=pwa-offlogin"></script>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    :root { --ink:#1c1917; --muted:#6b645b; --line:#d7d1c6; --brass:#b08948; --paper:#fcfbf8; --ok:#3f6b4a; --bad:#9f2d2d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; color:var(--ink); background:var(--paper); }
    header { display:flex; gap:16px; align-items:flex-end; padding:12px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header h1 { font-family: Outfit, Inter, sans-serif; font-size:18px; margin:0; }
    .lede { margin:4px 0 0; color:var(--muted); font-size:12px; max-width:820px; }
    .tools { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button { border:1px solid #1c1917; background:#1c1917; color:#fff; border-radius:6px; padding:8px 12px; font-weight:600; cursor:pointer; font:inherit; font-size:13px; }
    button.ghost { background:#fff; color:#1c1917; }
    a.link { color:var(--brass); font-weight:700; text-decoration:none; font-size:13px; }
    .page { padding:16px; display:grid; grid-template-columns: minmax(240px, 320px) 1fr; gap:12px; min-height:calc(100vh - 88px); }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .list { padding:0; margin:0; list-style:none; }
    .list li { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
    .list li:hover, .list li.on { background:#f8f1e3; }
    .list strong { display:block; font-size:14px; }
    .list span { display:block; margin-top:4px; font-size:12px; color:var(--muted); }
    .pill { display:inline-block; margin-top:6px; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; }
    .pill.live { color:var(--ok); }
    .pill.stale { color:var(--brass); }
    .pill.off { color:var(--bad); }
    #map { height:min(72vh, 640px); width:100%; background:#ece7dc; }
    .empty, .load, .err { padding:28px 16px; text-align:center; color:var(--muted); font-weight:600; }
    .err { color:var(--bad); }
    .msg { font-size:13px; color:var(--muted); }
    @media (max-width: 900px) {
      .page { grid-template-columns: 1fr; }
      #map { height:55vh; }
      .tools { width:100%; margin-left:0; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Driver tracker</h1>
      <p class="lede">Live pin from the driver’s phone while Driver run is open and location is allowed. Green is live (updated in the last 90 seconds). Brass is the last known place. Starts at Studio Delta, 309 Derdepoort Rd.</p>
    </div>
    <div class="tools">
      <a class="link" href="/delivery-forms">Delivery Forms</a>
      <span class="msg" id="status"></span>
      <button type="button" class="ghost" id="refreshBtn">Refresh</button>
    </div>
  </header>
  <div class="page">
    <section class="card">
      <div class="load" id="boot">Loading drivers…</div>
      <ul class="list" id="driverList" hidden></ul>
    </section>
    <section class="card">
      <div id="map"></div>
    </section>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/office-auth.js?v=login-msg-3"></script>
  <script>
    let drivers = [];
    let factory = null;
    let map, layer, selected = "";
    let timer = null;

    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    }
    function setMsg(text, bad) {
      const el = document.getElementById("status");
      el.textContent = text || "";
      el.style.color = bad ? "#9f2d2d" : "";
    }
    function pill(row) {
      if (row.live) return '<span class="pill live">Live now</span>';
      if (row.sharing === false) return '<span class="pill off">Not sharing</span>';
      return '<span class="pill stale">Last seen</span>';
    }
    function renderList() {
      const boot = document.getElementById("boot");
      const list = document.getElementById("driverList");
      boot.hidden = true;
      list.hidden = false;
      if (!drivers.length) {
        list.innerHTML = '<li><strong>No driver pin yet</strong><span>When the driver opens Driver run and allows location, their pin appears here.</span></li>';
        return;
      }
      list.innerHTML = drivers.map((row) => {
        const on = selected === row.name ? " on" : "";
        const age = row.live ? "Updating now" : (row.updated_label ? ("Updated " + row.updated_label) : "No update yet");
        return '<li class="' + on.trim() + '" data-name="' + esc(row.name) + '">' +
          "<strong>" + esc(row.name) + "</strong>" +
          "<span>" + esc(age) + "</span>" +
          pill(row) +
          "</li>";
      }).join("");
      list.querySelectorAll("[data-name]").forEach((el) => {
        el.onclick = () => {
          selected = el.getAttribute("data-name");
          renderList();
          renderMap(true);
        };
      });
    }
    function renderMap(focusSelected) {
      if (!window.L) return;
      if (!map) {
        map = L.map("map");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: "&copy; OpenStreetMap"
        }).addTo(map);
      }
      if (layer) map.removeLayer(layer);
      layer = L.layerGroup();
      const pts = [];
      const fac = factory || (drivers[0] && drivers[0].factory) || null;
      if (fac && fac.lat != null) {
        const m = L.circleMarker([fac.lat, fac.lng], {
          radius: 8, color: "#b08948", fillColor: "#b08948", fillOpacity: 0.9, weight: 2
        }).bindPopup("<b>" + esc(fac.label || "Studio Delta") + "</b><br>" + esc(fac.address || ""));
        layer.addLayer(m);
        pts.push([fac.lat, fac.lng]);
      }
      drivers.forEach((row) => {
        if (row.lat == null || row.lng == null) return;
        const color = row.live ? "#3f6b4a" : "#b08948";
        const m = L.circleMarker([row.lat, row.lng], {
          radius: row.live ? 11 : 8,
          color: color,
          fillColor: color,
          fillOpacity: 0.92,
          weight: 2
        }).bindPopup(
          "<b>" + esc(row.name) + "</b><br>" +
          (row.live ? "Live now" : ("Last seen " + esc(row.updated_label || ""))) +
          (row.accuracy != null ? "<br>±" + Math.round(row.accuracy) + " m" : "")
        );
        layer.addLayer(m);
        pts.push([row.lat, row.lng]);
        if (selected === row.name) m.openPopup();
      });
      layer.addTo(map);
      if (focusSelected && selected) {
        const hit = drivers.find((d) => d.name === selected && d.lat != null);
        if (hit) {
          map.setView([hit.lat, hit.lng], Math.max(map.getZoom(), 13));
          return;
        }
      }
      if (pts.length) map.fitBounds(pts, { padding: [36, 36], maxZoom: 14 });
      else if (fac && fac.lat != null) map.setView([fac.lat, fac.lng], 11);
      setTimeout(() => { if (map) map.invalidateSize(); }, 80);
    }
    async function load() {
      const r = await sdOfficeFetch("/api/delivery/locations");
      const j = await r.json().catch(() => ({}));
      if (!j || !j.ok) throw new Error((j && j.error) || "Could not load driver locations");
      factory = j.factory || null;
      drivers = j.drivers || [];
      if (selected && !drivers.some((d) => d.name === selected)) selected = "";
      if (!selected && drivers[0]) selected = drivers[0].name;
      renderList();
      renderMap(false);
      const live = drivers.filter((d) => d.live).length;
      setMsg(live
        ? (live + " live · " + drivers.length + " pin" + (drivers.length === 1 ? "" : "s"))
        : (drivers.length ? (drivers.length + " last-seen pin" + (drivers.length === 1 ? "" : "s")) : "Waiting for a driver pin"));
    }
    function startPoll() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        load().catch(() => {});
      }, 10000);
    }
    document.getElementById("refreshBtn").onclick = () => {
      load().catch((e) => setMsg(e.message || String(e), true));
    };
    sdMountOfficeShell("drivertracker");
    sdRequireOffice("reworks").then(() => {
      load().then(startPoll).catch((e) => {
        document.getElementById("boot").className = "err";
        document.getElementById("boot").textContent = (e && e.message) || String(e);
      });
    }).catch((e) => {
      document.getElementById("boot").className = "err";
      document.getElementById("boot").textContent = (e && e.message) || String(e);
    });
  </script>
</body>
</html>
